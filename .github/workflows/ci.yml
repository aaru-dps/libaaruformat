name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
          - name: win-x64-msvc
            os: windows-2025
            vs_arch: x64
            vcpkg_triplet: x64-windows
          - name: win-arm64-msvc
            os: windows-11-arm
            vs_arch: ARM64
            vcpkg_triplet: arm64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path "$root/vcpkg.exe")) {
            $root = "$env:RUNNER_TEMP/vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg $root
            & "$root/bootstrap-vcpkg.bat" -disableMetrics
          }
          $cache = "$env:RUNNER_TEMP/vcpkg-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "VCPKG_CACHE_DIR=$cache" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-${{ matrix.vcpkg_triplet }}-zlib-v1

      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:VCPKG_ROOT/vcpkg.exe" install "zlib:${{ matrix.vcpkg_triplet }}"'

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -A ${{ matrix.vs_arch }}
          "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE"
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure --timeout 600

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: build/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore

  qemu:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-armv7-qemu
            triplet: arm-linux-gnueabihf
            processor: armv7l
            qemu: arm
          - name: linux-x86-qemu
            triplet: i686-linux-gnu
            processor: i686
            qemu: i386
          - name: linux-ppc64le-qemu
            triplet: powerpc64le-linux-gnu
            processor: ppc64le
            qemu: ppc64le

    env:
      ZLIB_VERSION: v1.3.1
      ZLIB_PREFIX: ${{ github.workspace }}/zlib-${{ matrix.triplet }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qemu-user \
            gcc-${{ matrix.triplet }} g++-${{ matrix.triplet }}

      - name: Cache zlib
        id: cache-zlib
        uses: actions/cache@v4
        with:
          path: ${{ env.ZLIB_PREFIX }}
          key: zlib-${{ env.ZLIB_VERSION }}-${{ matrix.triplet }}-v1

      - name: Build zlib
        if: steps.cache-zlib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$ZLIB_VERSION" https://github.com/madler/zlib.git "$RUNNER_TEMP/zlib"
          cmake -S "$RUNNER_TEMP/zlib" -B "$RUNNER_TEMP/zlib-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -DCMAKE_C_COMPILER=${{ matrix.triplet }}-gcc \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX="$ZLIB_PREFIX"
          cmake --build "$RUNNER_TEMP/zlib-build" --parallel
          cmake --install "$RUNNER_TEMP/zlib-build"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -DCMAKE_C_COMPILER=${{ matrix.triplet }}-gcc \
            -DCMAKE_CXX_COMPILER=${{ matrix.triplet }}-g++ \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-${{ matrix.qemu }};-L;/usr/${{ matrix.triplet }}" \
            -DZLIB_ROOT="$ZLIB_PREFIX" \
            -DZLIB_USE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 1800

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: build/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore

  mingw:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64-mingw
            os: windows-2025
            msystem: MINGW64
            toolchain: gcc
          - name: win-arm64-mingw
            os: windows-11-arm
            msystem: CLANGARM64
            toolchain: clang

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            ${{ matrix.toolchain }}:p
            cmake:p
            ninja:p
            zlib:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: build/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore
